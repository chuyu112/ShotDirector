services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_MANJING_API_BASE: /api
        INSTALL_LIBTV: ${INSTALL_LIBTV:-1}
        LIBTV_VERSION: ${LIBTV_VERSION:-1.1.3}
        LIBTV_SHA256_AMD64: ${LIBTV_SHA256_AMD64:-cf86f462c5aed60f95dca978cc91ece98c60bcfa27337da008ad59953c3ea7da}
        LIBTV_SHA256_ARM64: ${LIBTV_SHA256_ARM64:-369b43f5be1d28dbbde7c1b6711ed746bf9bff1028ba794a6dae4fa01bed601c}
    image: manjing-server:${MANJING_IMAGE_TAG:-local}
    command: ["npm", "run", "start:web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANJING_WEB_HOST_PORT:-13300}:3000"
    networks: [manjing]

  gateway:
    image: manjing-server:${MANJING_IMAGE_TAG:-local}
    command: ["npm", "run", "start:gateway"]
    restart: unless-stopped
    env_file: [.env.server]
    environment:
      MANJING_GATEWAY_HOST: 0.0.0.0
      MANJING_GATEWAY_PORT: 8080
      MANJING_APP_ROOT: /app
      MANJING_DATA_ROOT: /data
      MANJING_PUBLIC_API_BASE: /api
      LIBTV_BIN: /usr/local/bin/libtv
    volumes:
      - manjing-data:/data
    ports:
      - "127.0.0.1:${MANJING_GATEWAY_HOST_PORT:-18180}:8080"
    stop_grace_period: 15m30s
    networks: [manjing]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [web, gateway]
    ports:
      - "127.0.0.1:${MANJING_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx.manjing.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks: [manjing]

networks:
  manjing:

volumes:
  manjing-data:
