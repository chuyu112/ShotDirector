# Canonical HTTPS entry for the overseas Manjing deployment.
server {
    listen 80;
    listen [::]:80;
    server_name kakayiduo.cloud www.kakayiduo.cloud;

    location / {
        return 301 https://kakayiduo.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kakayiduo.cloud;

    ssl_certificate /etc/letsencrypt/live/kakayiduo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakayiduo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kakayiduo.cloud$request_uri;
}

server {
    # Multiplex long AI requests with save/health/model-catalog requests.
    # nginx 1.22 on the overseas host uses the listen parameter syntax.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kakayiduo.cloud;

    ssl_certificate /etc/letsencrypt/live/kakayiduo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakayiduo.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18180/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:13300;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
