# ACME HTTP entry while manjing.kakayiduo.cloud is waiting for its certificate.
server {
    listen 80;
    listen [::]:80;
    server_name manjing.kakayiduo.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
