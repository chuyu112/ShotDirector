# Temporary HTTP-only host used to obtain the first ACME certificate.
server {
    listen 80;
    listen [::]:80;
    server_name manjing.jadecircle.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "Manjing HTTPS bootstrap\n";
    }
}
